- name: Install python-psycopg2
  ansible.builtin.dnf:
    name: python-psycopg2
    state: present
  tags:
    - install-patroni

- name: Install patroni python package
  ansible.builtin.pip:
    name: "patroni[etcd3]"
    state: latest
  tags:
    - install-patroni

- name: Permit Patroni REST API port
  ansible.posix.firewalld:
    port: 8008/tcp
    state: enabled
    permanent: true
    immediate: true
  tags:
    - install-patroni

- name: Create directory for patrhoni
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: 0700
  tags:
    - install-patroni

- name: Upload patroni.yml
  ansible.builtin.template:
    src: templates/patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: 0600
  tags:
  - install-patroni

- name: Upload unit file for patroni
  ansible.builtin.copy:
    src: files/patroni.service
    dest: /usr/lib/systemd/system/
    mode: 0644
  tags:
  - install-patroni

- name: Start patroni
  ansible.builtin.systemd_service:
    name: patroni
    state: started
    enabled: true
    daemon_reload: true
  tags:
  - install-patroni
